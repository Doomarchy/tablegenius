name: Update data and deploy

on:
  schedule:
    # Quiet hours: two runs a day (UTC).
    - cron: "0 3,9 * * *"
    # Weekday evenings, hourly (midweek fixtures, Friday/Monday night games).
    - cron: "0 17-23 * * 1-5"
    # Weekends, hourly from midday.
    - cron: "0 12-23 * * 0,6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Fetch data and run the pipeline
        id: pipeline
        working-directory: pipeline
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python -m tablegenius.run --season 2026-27 2>&1 | tee pipeline.log

      - name: Commit updated data
        run: |
          git config user.name "tablegenius-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/data pipeline/history
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ -f public/CNAME ]] || [[ "$REPO" == *.github.io ]]; then export BASE_PATH="/"; else export BASE_PATH="/$REPO/"; fi
          echo "Building with BASE_PATH=$BASE_PATH"
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - name: Close any open failure alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label pipeline-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The scheduled run succeeded again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

      - name: Open a failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pipeline-failure --description "A scheduled data run failed" --color B60205 2>/dev/null || true
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TAIL=$(tail -n 40 pipeline/pipeline.log 2>/dev/null || echo "(no pipeline log)")
          if [ -z "$(gh issue list --label pipeline-failure --state open --json number --jq '.[].number')" ]; then
            gh issue create --title "Scheduled data run failed ($(date -u +%Y-%m-%d))" --label pipeline-failure \
              --body "$(printf 'The update-and-deploy workflow failed. Run: %s\n\nLast lines of the pipeline log:\n\n```\n%s\n```\n\nThe site keeps serving the previous data until a run succeeds; this issue closes itself then.' "$RUN_URL" "$TAIL")"
          else
            gh issue comment "$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number')" --body "Failed again: $RUN_URL"
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
